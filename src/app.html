<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1b22" />
		<!-- Private, auth-gated instance: keep it out of search indexes. -->
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<script>
			// Pre-paint theme resolution. Runs before the stylesheet paints so the
			// correct `.dark` class is on <html> with no flash. `funnel:theme`
			// holds "system" | "dark" | "light".
			(function () {
				try {
					var choice = localStorage.getItem("funnel:theme") || "system";
					var resolved =
						choice === "system"
							? window.matchMedia("(prefers-color-scheme: light)").matches
								? "light"
								: "dark"
							: choice;
					document.documentElement.classList.toggle("dark", resolved === "dark");
				} catch (e) {
					document.documentElement.classList.add("dark");
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
