<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" />
		<!-- Private, auth-gated instance: keep it out of search indexes. -->
		<meta name="robots" content="noindex, nofollow" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<script>
			// Pre-paint theme resolution. Runs before the stylesheet paints so the
			// correct `data-theme` is on <html> with no flash. `funnel:theme`
			// holds "system" | "dark" | "light".
			(function () {
				var root = document.documentElement;
				var theme = "light";
				try {
					var choice = localStorage.getItem("funnel:theme") || "system";
					theme =
						choice === "system"
							? window.matchMedia("(prefers-color-scheme: dark)").matches
								? "dark"
								: "light"
							: choice;
				} catch (e) {
					theme = window.matchMedia("(prefers-color-scheme: dark)").matches
						? "dark"
						: "light";
				}
				root.setAttribute("data-theme", theme);
				root.style.colorScheme = theme;
				root.classList.toggle("dark", theme === "dark");
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute("content", theme === "dark" ? "#161616" : "#ffffff");
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
