name: verify

on:
  push:
    branches:
      - main
  pull_request:

# Superseded pull request runs are cancelled; pushes to main are not.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Install dependencies
        run: mise run bun:install

      - name: Verify
        run: mise run verify

  windows-package:
    # Kept under the same job name because branch protection requires this
    # check. It now runs the same full gate as Ubuntu; the suite is kept
    # Windows-clean by #164 so both platforms agree.
    name: Windows package (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v5

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install dependencies
        run: mise run bun:install

      - name: Verify
        run: mise run verify
