name: publish

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag against package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(jq -r .version package.json)"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "::error::Tag ${tag} does not match package.json version ${version}."
            exit 1
          fi
          if [[ "${version}" == 0.* || "${version}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/funnel-intake/go.mod
          cache-dependency-path: tools/funnel-intake/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Vet intake helper
        run: go -C tools/funnel-intake vet -unsafeptr=false ./...

      - name: Test intake helper
        run: go -C tools/funnel-intake test ./...

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            platform: linux-x64
            outfile: funnel
          - os: ubuntu-latest
            target: bun-linux-arm64
            platform: linux-arm64
            outfile: funnel
            cross_arm64: true
          - os: macos-15
            target: bun-darwin-arm64
            platform: darwin-arm64
            outfile: funnel
          - os: macos-15-intel
            target: bun-darwin-x64
            platform: darwin-x64
            outfile: funnel
          - os: windows-latest
            target: bun-windows-x64
            platform: windows-x64
            outfile: funnel.exe
            build_intake: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux arm64 native addon
        if: matrix.cross_arm64
        run: bun install --frozen-lockfile --os=linux --cpu=arm64

      - name: Build server
        run: bun run build

      - name: Build standalone executable
        run: >-
          bun scripts/build-standalone.ts
          --target=${{ matrix.target }}
          --outdir=dist
          --outfile=${{ matrix.outfile }}

      - name: Setup Go
        if: matrix.build_intake
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/funnel-intake/go.mod
          cache-dependency-path: tools/funnel-intake/go.sum

      - name: Build Windows intake helper
        if: matrix.build_intake
        run: bun scripts/build-intake.ts

      - name: Smoke test (Unix)
        if: runner.os != 'Windows' && matrix.platform != 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          ./dist/${{ matrix.outfile }} --version
          FUNNEL_DATA_DIR="$RUNNER_TEMP/funnel-smoke" ./dist/${{ matrix.outfile }} --migrate

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\funnel.exe --version
          $env:FUNNEL_DATA_DIR = Join-Path $env:RUNNER_TEMP "funnel-smoke"
          .\dist\funnel.exe --migrate

      - name: Verify Linux arm64 executable
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: file dist/funnel | grep -q 'ARM aarch64'

      - name: Verify embedded static assets
        if: runner.os != 'Windows' && matrix.platform != 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          export FUNNEL_DATA_DIR="$RUNNER_TEMP/funnel-assets"
          export FUNNEL_SECRET="0123456789abcdef0123456789abcdef"
          export PORT=3919
          export HOST=127.0.0.1
          ./dist/${{ matrix.outfile }} > "$RUNNER_TEMP/funnel-assets.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/onboarding" -o "$RUNNER_TEMP/onboarding.html"; then
              break
            fi
            sleep 1
          done
          if [[ ! -s "$RUNNER_TEMP/onboarding.html" ]]; then
            echo "::error::The packaged server did not serve /onboarding."
            cat "$RUNNER_TEMP/funnel-assets.log"
            exit 1
          fi
          css_path="$(grep -oE 'href="[^"]+\.css[^"]*"' "$RUNNER_TEMP/onboarding.html" | head -1 | cut -d'"' -f2)"
          if [[ -z "$css_path" ]]; then
            echo "::error::Onboarding page did not reference a CSS asset."
            cat "$RUNNER_TEMP/funnel-assets.log"
            exit 1
          fi
          css_url="http://127.0.0.1:${PORT}/${css_path#./}"
          curl -fsS "$css_url" -o "$RUNNER_TEMP/style.css"
          if [[ ! -s "$RUNNER_TEMP/style.css" ]]; then
            echo "::error::Embedded stylesheet ${css_path} was empty."
            cat "$RUNNER_TEMP/funnel-assets.log"
            exit 1
          fi
          echo "Embedded stylesheet OK ($(wc -c < "$RUNNER_TEMP/style.css") bytes)"

      - name: Package release archive
        run: >-
          bun scripts/package-release.ts
          --version=${{ needs.validate.outputs.version }}
          --platform=${{ matrix.platform }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: funnel-${{ matrix.platform }}
          path: release/funnel-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [validate, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: funnel-*
          merge-multiple: true

      - name: Merge checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          ls -l
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          if bun scripts/release-notes.ts --version="${VERSION}" > "$notes_file" 2>/dev/null \
            && [[ -s "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          elif [[ -f ".github/release-notes/${TAG}.md" ]]; then
            notes_args=(--notes-file ".github/release-notes/${TAG}.md")
          else
            printf 'See the assets below for the platform archives and checksums.\n' \
              > "$RUNNER_TEMP/generic-notes.md"
            notes_args=(--notes-file "$RUNNER_TEMP/generic-notes.md")
          fi

          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_args=(--prerelease)
          else
            prerelease_args=()
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release/* --clobber
            gh release edit "${TAG}" \
              --title "Funnel ${VERSION}" \
              "${notes_args[@]}" \
              "${prerelease_args[@]}"
          else
            gh release create "${TAG}" release/* \
              --title "Funnel ${VERSION}" \
              --verify-tag \
              "${prerelease_args[@]}" \
              "${notes_args[@]}"
          fi
