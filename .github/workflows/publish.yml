name: publish

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check tag against package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(jq -r .version package.json)"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "::error::Tag ${tag} does not match package.json version ${version}."
            exit 1
          fi
          # 0.0.x is the pre-release line. 0.1.0 is the first normal release;
          # only an explicit -suffix (for example 0.1.0-rc.1) stays a pre-release.
          if [[ "${version}" == 0.0.* || "${version}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy

      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Test intake app
        working-directory: tools/funnel-intake/rust
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            platform: linux-x64
            outfile: funnel
          - os: ubuntu-latest
            target: bun-linux-arm64
            platform: linux-arm64
            outfile: funnel
            cross_arm64: true
          - os: macos-15
            target: bun-darwin-arm64
            platform: darwin-arm64
            outfile: funnel
            build_intake: true
          - os: macos-15-intel
            target: bun-darwin-x64
            platform: darwin-x64
            outfile: funnel
            build_intake: true
          - os: windows-latest
            target: bun-windows-x64
            platform: windows-x64
            outfile: funnel.exe
            build_intake: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux arm64 native addon
        if: matrix.cross_arm64
        run: bun install --frozen-lockfile --os=linux --cpu=arm64

      - name: Build server
        run: bun run build

      - name: Build standalone executable
        run: >-
          bun scripts/build-standalone.ts
          --target=${{ matrix.target }}
          --outdir=dist
          --outfile=${{ matrix.outfile }}

      - name: Setup Rust
        if: matrix.build_intake
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'

      - name: Build intake app
        if: matrix.build_intake
        run: bun scripts/build-intake.ts --platform=${{ matrix.platform }}

      - name: Fetch pinned WinSW
        if: matrix.platform == 'windows-x64'
        run: bun scripts/fetch-winsw.ts

      - name: Smoke test (Unix)
        if: runner.os != 'Windows' && matrix.platform != 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          ./dist/${{ matrix.outfile }} --version
          FUNNEL_DATA_DIR="$RUNNER_TEMP/funnel-smoke" ./dist/${{ matrix.outfile }} --migrate

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\funnel.exe --version
          $env:FUNNEL_DATA_DIR = Join-Path $env:RUNNER_TEMP "funnel-smoke"
          .\dist\funnel.exe --migrate

      - name: Verify Linux arm64 executable
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: file dist/funnel | grep -q 'ARM aarch64'

      - name: Verify embedded static assets
        if: runner.os != 'Windows' && matrix.platform != 'linux-arm64'
        shell: bash
        run: |
          set -euo pipefail
          export FUNNEL_DATA_DIR="$RUNNER_TEMP/funnel-assets"
          export FUNNEL_SECRET="0123456789abcdef0123456789abcdef"
          export PORT=3919
          export HOST=127.0.0.1
          ./dist/${{ matrix.outfile }} > "$RUNNER_TEMP/funnel-assets.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/onboarding" -o "$RUNNER_TEMP/onboarding.html"; then
              break
            fi
            sleep 1
          done
          if [[ ! -s "$RUNNER_TEMP/onboarding.html" ]]; then
            echo "::error::The packaged server did not serve /onboarding."
            cat "$RUNNER_TEMP/funnel-assets.log"
            exit 1
          fi
          css_path="$(grep -oE 'href="[^"]+\.css[^"]*"' "$RUNNER_TEMP/onboarding.html" | head -1 | cut -d'"' -f2)"
          if [[ -z "$css_path" ]]; then
            echo "::error::Onboarding page did not reference a CSS asset."
            cat "$RUNNER_TEMP/funnel-assets.log"
            exit 1
          fi
          css_url="http://127.0.0.1:${PORT}/${css_path#./}"
          curl -fsS "$css_url" -o "$RUNNER_TEMP/style.css"
          if [[ ! -s "$RUNNER_TEMP/style.css" ]]; then
            echo "::error::Embedded stylesheet ${css_path} was empty."
            cat "$RUNNER_TEMP/funnel-assets.log"
            exit 1
          fi
          echo "Embedded stylesheet OK ($(wc -c < "$RUNNER_TEMP/style.css") bytes)"

          # The manifest form is a same-origin POST. This catches the adapter's
          # https-by-default origin (which breaks CSRF on a direct HTTP bind)
          # and SvelteKit's Secure-by-default cookie on a non-localhost host.
          manifest_status="$(
            curl -sS -o "$RUNNER_TEMP/manifest.html" \
              -D "$RUNNER_TEMP/manifest.headers" \
              -w '%{http_code}' \
              -X POST "http://127.0.0.1:${PORT}/onboarding/manifest" \
              -H "Origin: http://127.0.0.1:${PORT}" \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data 'account=user&name=funnel-smoke'
          )"
          if [[ "${manifest_status}" != "200" ]]; then
            echo "::error::Onboarding manifest POST returned ${manifest_status}, expected 200."
            cat "$RUNNER_TEMP/manifest.headers" "$RUNNER_TEMP/funnel-assets.log"
            exit 1
          fi
          if grep -qi '^set-cookie:.*secure' "$RUNNER_TEMP/manifest.headers"; then
            echo "::error::Onboarding state cookie is Secure on a plain HTTP request."
            cat "$RUNNER_TEMP/manifest.headers"
            exit 1
          fi
          echo "Onboarding manifest POST OK"

      - name: Package release archive
        run: >-
          bun scripts/package-release.ts
          --version=${{ needs.validate.outputs.version }}
          --platform=${{ matrix.platform }}

      - name: Verify Windows release archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.validate.outputs.version }}"
          $server = "funnel-$version-windows-x64"
          $intake = "funnel-intake-$version-windows-x64"
          Expand-Archive "release/$server.zip" -DestinationPath "$env:RUNNER_TEMP/packages"
          Expand-Archive "release/$intake.zip" -DestinationPath "$env:RUNNER_TEMP/packages"
          $expected = @{
            $server = @('START-HERE.cmd', 'funnel.exe', 'funnel-service.exe', '.env.example', 'README.txt', 'THIRD_PARTY_NOTICES.md')
            $intake = @('funnel-intake.exe', 'install-intake.ps1', 'README.txt', 'THIRD_PARTY_NOTICES.md')
          }
          foreach ($name in @($server, $intake)) {
            $actual = @(Get-ChildItem -Force "$env:RUNNER_TEMP/packages/$name" | Select-Object -ExpandProperty Name | Sort-Object)
            $difference = Compare-Object ($expected[$name] | Sort-Object) $actual
            if ($difference) { throw "Unexpected contents in ${name}: $difference" }
            $hash = (Get-FileHash "release/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content "release/$name.zip.sha256" -Raw).Trim() -ne "$hash  $name.zip") {
              throw "Checksum mismatch for $name.zip"
            }
          }

      - name: Verify macOS intake archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          platform="${{ matrix.platform }}"
          name="funnel-intake-$version-$platform"
          actual="$(unzip -Z1 "release/$name.zip" | sed 's#/$##' | sort)"
          expected="$(printf '%s\n' "$name" "$name/README.txt" "$name/THIRD_PARTY_NOTICES.md" "$name/funnel-intake" "$name/install-intake.sh" | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected contents in $name.zip"
            echo "$actual"
            exit 1
          fi
          hash="$(shasum -a 256 "release/$name.zip" | cut -d' ' -f1)"
          expected_hash="$(cut -d' ' -f1 "release/$name.zip.sha256")"
          if [ "$hash" != "$expected_hash" ]; then
            echo "::error::Checksum mismatch for $name.zip"
            exit 1
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: funnel-${{ matrix.platform }}
          path: |
            release/funnel-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.*
            release/funnel-intake-${{ needs.validate.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [validate, verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: funnel-*
          merge-multiple: true

      - name: Merge checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          ls -l
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.sha256
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail

          notes_file="$RUNNER_TEMP/release-notes.md"
          if bun scripts/release-notes.ts --version="${VERSION}" > "$notes_file" 2>/dev/null \
            && [[ -s "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          elif [[ -f ".github/release-notes/${TAG}.md" ]]; then
            notes_args=(--notes-file ".github/release-notes/${TAG}.md")
          else
            printf 'See the assets below for the platform archives and checksums.\n' \
              > "$RUNNER_TEMP/generic-notes.md"
            notes_args=(--notes-file "$RUNNER_TEMP/generic-notes.md")
          fi

          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_args=(--prerelease)
          else
            prerelease_args=()
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release/* --clobber
            gh release edit "${TAG}" \
              --title "Funnel ${VERSION}" \
              "${notes_args[@]}" \
              "${prerelease_args[@]}"
          else
            gh release create "${TAG}" release/* \
              --title "Funnel ${VERSION}" \
              --verify-tag \
              "${prerelease_args[@]}" \
              "${notes_args[@]}"
          fi
