name: Intake Rust prototype

on:
  pull_request:
    paths:
      - 'tools/funnel-intake/rust/**'
      - '.github/workflows/intake-rust.yml'
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/funnel-intake/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP "intake-config.json"
          $out = cargo run --locked -- daemon --simulate "Hello world" --config $config
          $url = ($out | Select-String '^url=').Line
          if ($url -ne 'url=http://localhost:3000/intake?body=Hello+world&source=simulated-app&title=Hello+world') {
            throw "unexpected simulated URL: $url"
          }
          cargo run --locked -- check --config $config
          cargo run --locked -- autostart status
          $exe = Join-Path $PWD "target\debug\funnel-intake.exe"
          $daemon = Start-Process -FilePath $exe -ArgumentList @('daemon', '--config', $config) -PassThru
          Start-Sleep -Seconds 2
          if ($daemon.HasExited) { throw "daemon exited with code $($daemon.ExitCode)" }
          Stop-Process -Id $daemon.Id -Force
      - if: runner.os == 'macOS'
        run: |
          config="$RUNNER_TEMP/intake-config.json"
          out="$(cargo run --locked -- daemon --simulate 'Hello world' --config "$config")"
          test "$out" = "url=http://localhost:3000/intake?body=Hello+world&source=simulated-app&title=Hello+world"
          cargo run --locked -- check --config "$config"
          cargo run --locked -- autostart status
          target/debug/funnel-intake daemon --debug --config "$config" > "$RUNNER_TEMP/daemon.log" 2>&1 &
          pid=$!
          sleep 2
          if ! kill -0 "$pid"; then
            cat "$RUNNER_TEMP/daemon.log"
            exit 1
          fi
          kill "$pid"
          wait "$pid" || true
      - if: runner.os == 'Linux'
        run: |
          cargo run --locked -- --snap /tmp/intake.png --tree /tmp/intake.json
          test -s /tmp/intake.png
          grep -q 'Settings are not available yet' /tmp/intake.json
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: intake-rune-placeholder
          path: |
            /tmp/intake.png
            /tmp/intake.json
