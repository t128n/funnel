name: changesets

on:
  push:
    branches:
      - main

concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  select-mode:
    name: Select release mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # `changeset publish-plan` compares package versions with existing
          # tags; a shallow checkout hides them and would select publish on
          # every push after a release.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Until 0.1.0, keep the 0.0.x line patch-only. A minor/major changeset
      # would skip the first release, so fail before a version PR is opened.
      - name: Check pre-release changeset bumps
        run: bun run changeset:check

      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version packages
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Create or update version pull request
        uses: changesets/action/version@v2
        with:
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  tag:
    name: Tag release
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Create git tag
        uses: changesets/action/publish@v2
        with:
          create-github-releases: false
          push-git-tags: true

      - name: Read released tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Tagged v${version}"

  publish:
    name: Publish executables
    needs: [select-mode, tag]
    if: needs.select-mode.outputs.mode == 'publish' && needs.tag.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
