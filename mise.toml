# One source of truth for building Funnel. Local development and any CI
# (GitHub Actions, Jenkins, …) call these tasks, so nothing important lives
# only in a pipeline definition.
#
#   mise run            # list the available tasks
#   mise run build      # production build into build/
#   mise run exe        # self-contained executable into dist/
#   mise run verify     # everything the release pipeline relies on
#
# Overrides:
#   mise run exe --target=bun-linux-x64   # cross-target (needs that platform's
#                                         # satteri package installed)
#   TARGET=bun-linux-x64 mise run exe      # same, via the environment

[tools]
bun = "1.4.3"
go = "1.27"
node = "24.22.0"

[tasks.default]
description = "List the available tasks"
run = "mise tasks"

[tasks."bun:install"]
description = "Install dependencies from the lockfile"
run = "bun install --frozen-lockfile"

[tasks.check]
description = "Type-check the project"
run = "bun run check"

[tasks.test]
description = "Run the test suite"
run = "bun run test"

[tasks.build]
description = "Production SvelteKit build (build/)"
sources = [
  "src/**",
  "static/**",
  "drizzle/**",
  "package.json",
  "bun.lock",
  "tsconfig.json",
  "vite.config.ts",
]
outputs = ["build"]
run = "bun run build"

[tasks."docs:dev"]
description = "Run the documentation site locally"
run = "bun run docs:dev"

[tasks."docs:build"]
description = "Build the documentation site"
run = "bun run docs:build"

[tasks.release]
description = "Apply pending database migrations (the release phase)"
run = "bun run release"

[tasks.exe]
description = "Build the self-contained executable for this OS into dist/"
depends = ["build", "intake:exe"]
usage = '''
flag "--target <target>" env="TARGET" default="" help="Bun compile target, e.g. bun-linux-x64"
'''
sources = [
  "build/**",
  "drizzle/**",
  "src/standalone.ts",
  "scripts/build-standalone.ts",
  "scripts/standalone/**",
  "package.json",
  "bun.lock",
]
# Target-aware, so switching compile targets always rebuilds instead of
# reusing the other platform's artifact.
outputs = [
  'dist/funnel{% if (usage.target and "windows" in usage.target) or (not usage.target and os() == "windows") %}.exe{% endif %}',
]
run = 'bun scripts/build-standalone.ts{% if usage.target %} --target={{ usage.target }}{% endif %}'

[tasks.smoke]
description = "Smoke-test the standalone executable in dist/ (CLI, migrations, boot, health)"
depends = ["exe"]
run = "bun scripts/smoke-standalone.ts"

[tasks.verify]
description = "Run everything the release pipeline relies on"
run = [
  { task = "check" },
  { task = "test" },
  { task = "intake:check" },
  { task = "build" },
  { task = "exe" },
  { task = "smoke" },
]

[tasks."intake:exe"]
description = "Build the native intake hotkey helper into dist/"
sources = [
  "tools/funnel-intake/**",
  "scripts/build-intake.ts",
  "package.json",
  "bun.lock",
]
outputs = ["dist/funnel-intake.exe"]
run = "bun scripts/build-intake.ts"

[tasks."intake:check"]
description = "Vet and test the intake hotkey helper"
run = [
  "go -C tools/funnel-intake vet -unsafeptr=false ./...",
  "go -C tools/funnel-intake test ./...",
]

[tasks."intake:install"]
description = "Install the intake hotkey helper for the current user"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-intake.ps1"

[tasks."intake:uninstall"]
description = "Remove the intake hotkey helper"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-intake.ps1 -Uninstall"
