# Funnel instance configuration.
#
# Copy to `funnel.config.yaml` (git-ignored) and adjust for your instance.
# All keys are optional except `repos`; omitted keys fall back to the defaults
# shown here. See docs/SPEC.md §4 and §10 for the authoritative reference.

github:
  url: https://github.com               # Web base (e.g. https://acme.ghe.com)
  api_url: https://api.github.com       # API base (e.g. https://acme.ghe.com/api/v3)

repos: # Required. At least one `owner/name` repository.
  - orgA/core
  - orgA/web
  - orgB/infra

intake:
  default_repo: orgA/core               # Pre-fills the Accept dialog (must be listed above)

sync:
  history_days: 90                      # Closed issues history window
  poll_interval_active_seconds: 30      # Active SSE connection interval
  poll_interval_idle_seconds: 300       # Background idle interval

board:
  done_days: 14                         # Retention window for the Done column
  wip_limits:                           # Optional per-stage Work-in-Progress caps
    in-progress: 3                      # Omitted stages have no limit; Done is never capped

session:
  idle_days: 30                         # User session lifetime
